services:
  postgres:
    image: 'postgis/postgis:16-3.4'
    container_name: japan-travel-db
    environment:
      - 'POSTGRES_DB=japan_travel'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: