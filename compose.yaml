services:
  postgres:
    image: 'postgis/postgis:16-3.4'
    container_name: japan-travel-db
    environment:
      - 'POSTGRES_DB=japan_travel'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
    ports:
      # 11-15 보안: 이 PC 에서만 접속 (같은 와이파이의 다른 기기에서 DB 에 붙지 못하게)
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: