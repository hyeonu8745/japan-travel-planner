spring:
  application:
    name: japan-travel-planner

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/japan_travel
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 11-14 DB 구조는 Flyway(src/main/resources/db/migration)가 만든다. 테이블·컬럼을 바꿀 땐 V3__*.sql 처럼 새 파일을 더한다
  # 원래 DB 는 V1 을 실행하지 않고 "버전 1"로 기록만 한 뒤 V2 부터 실행한다 (baseline-on-migrate)
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    # 11-15 보안·성능: 응답을 다 보낼 때까지 DB 연결을 붙잡지 않는다 (DB 작업은 서비스의 트랜잭션 안에서 끝낸다)
    open-in-view: false
    hibernate:
      # Hibernate 는 엔티티와 DB 구조가 맞는지 확인만 한다 (예전 update 는 제약을 마음대로 만들고 지우지 않았다)
      ddl-auto: validate
    # SQL 로그는 아래 logging.level.org.hibernate.SQL 하나로 (show-sql 까지 켜면 같은 SQL 이 두 번 찍혔다, 11-08)
    properties:
      hibernate:
        format_sql: true
        # 11-08 N+1: 일정 응답이 항목마다 관광지·식당을 한 건씩 불러 쿼리 28개였다.
        # 지연 로딩하는 연관(관광지·식당·여행)과 컬렉션을 IN 으로 최대 100개씩 묶어 부른다
        default_batch_fetch_size: 100

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000  # 1시간

app:
  cors:
    allowed-origins: http://localhost:5173

  security:
    login:                       # 11-15 같은 이메일 + 같은 IP 로 5번 틀리면 15분 막기 (429)
      max-failures: 5
      lock-minutes: 15
    refresh:                     # 11-15 갱신 토큰 (HttpOnly 쿠키 refresh_token, Path=/api/auth)
      ttl-days: 7
      max-sessions: 5            # 한 계정 동시 로그인 브라우저 수 (넘으면 가장 오래 안 쓴 브라우저 로그아웃)
      reuse-grace-seconds: 10
      cookie-secure: false       # 로컬은 http 라서 false. 배포(HTTPS)에서는 반드시 true
      cookie-same-site: Lax

  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com/v1
    basic-model: gpt-4o-mini
    advanced-model: gpt-5.6-terra
    advanced-reasoning-effort: low
    max-output-tokens: 2000
    timeout-seconds: 60

  google:
    api-key: ${GOOGLE_MAPS_API_KEY}
    timeout-seconds: 10
    places-language: ko          # 장소 상세(소개·리뷰·영업시간) 언어. 리뷰는 번역되어 오고 원문도 함께 온다
    photo-max-width-px: 800      # 장소 사진 기본 가로 크기

  restaurant-match:              # 타베로그 식당 ↔ Google 장소 매칭 (일정 생성 때 고른 식당만, Text Search Pro 월 5,000건 무료)
    enabled: true
    search-radius-meters: 300    # 이 원 안을 우선해서 검색
    max-distance-meters: 300     # 우리 좌표와 이 거리 안이어야 같은 가게
    min-name-similarity: 0.7     # 이름 비슷한 정도 (0~1)
    loanword-max-distance-meters: 100   # 가타카나 ↔ 영어 이름으로 맞출 때 허용 거리
    loanword-min-similarity: 0.6        # 가타카나 ↔ 영어 자음 뼈대 비슷한 정도
    page-size: 3                 # 검색 결과 몇 개를 비교할지
    verify-rounds: 2             # 폐업 의심 식당을 빼고 다시 계산하는 최대 횟수

  korean-name:                   # 장소·식당 한국어 이름 (일정에 처음 쓰일 때 AI로 한 번 만들어 저장, 10-11)
    enabled: true
    timeout-seconds: 40          # 넘으면 원래 이름으로 진행 (고급 모델은 이름 30개에 수십 초)
    max-per-call: 30             # 한 번에 보내는 이름 수
    retry-after-minutes: 30      # 실패한 이름은 이 시간 동안 다시 묻지 않는다
    use-advanced-model: true     # gpt-5.6-terra로 만든다 (10-11: 기본 모델이 増上寺 → "조우장사", Chopsticks → "초밥"). 이름마다 한 번만 만들어 저장

  review-insight:                # 식당 상세의 Google 리뷰를 AI(gpt-4o-mini)로 읽고 차별·불친절·위생·좋은 점 표시 (저장 안 함)
    enabled: true
    timeout-seconds: 8           # 넘으면 분석 없이 상세를 돌려준다

  travel:
    use-google-routes: false     # true면 도보 시간을 Google Routes(WALK)에서 실시간 조회 (저장 안 함)
    walk-threshold-minutes: 30   # 이 시간 이내는 도보 (10-10: 20 → 30, 한 지역 안에서 넓게 걷는다)
    relaxed-walk-threshold-minutes: 10   # 여유 속도·이동 제약·가까운 곳 선호일 때
    walk-meters-per-minute: 80
    walk-detour: 1.25            # 실제 길은 직선보다 25% 돌아감
    transit-meters-per-minute: 333   # 대중교통 평균 (시속 20km, 환승 포함)
    transit-detour: 1.3
    transit-overhead-minutes: 8  # 역까지 걷기, 기다리기
    drive-meters-per-minute: 416 # 도심 운전 (시속 25km)
    drive-overhead-minutes: 5    # 주차

  candidate:
    prior-reviews: 200        # 보정 평점: 이만큼의 리뷰는 전체 평균이라고 가정
    interest-bonus: 0.3       # 관심사와 맞는 type이면 가산
    extra-candidates: 2       # 하루 방문 수보다 더 뽑아두는 예비 후보
    same-spot-meters: 150     # 이 거리 안의 관광지는 같은 장소로 보고 점수 높은 하나만 남김
    min-reviews: 100          # 후보 기준 (셋 중 하나): 리뷰 이 수 이상
    min-popularity: 1         #   또는 위키 인기도(언어 수) 이 값 이상, 또는 꼭 가는 곳
    base-score: 4.0           # 기본 점수 = 기준값 + 평점 보정 + 유명함 + 종류 보정 + 꼭 가는 곳 가산
    popularity-weight: 0.4    # 유명함 = max(이 값 × log10(1 + 인기도),
    review-fame-weight: 0.3   #              이 값 × log10(1 + 리뷰 수 / 100))
    must-see-bonus: 0.5       # 그 도시에서 꼭 가는 곳 가산
    same-kind-penalty: 0.15   # 하루 안에서 같은 종류(정원·절·박물관 등)를 또 고르면 감점 (가까운 곳 위주 여행은 적용 안 함)
    near-meters: 500          # 이미 고른 곳에서 이 거리 안이면
    near-penalty: 0.2         # 이만큼 감점 (한 동네에 몰리지 않게)
    # 하루 이동 범위 (10-11 사용자 결정: 하루에 두 지역은 돈다). 중심 지역에서 이 거리 안의 이웃 지역 하나를 함께 돈다
    day-range-compact-km: 7   # 가까운 곳 위주 (이동 제약·적게 걷기)
    day-range-transit-km: 10  # 대중교통
    day-range-car-km: 12      # 렌터카
    partner-distance-penalty-per-km: 0.15   # 이웃 지역 고를 때 중심 사이 1km당 감점
    partner-reuse-penalty: 0.5               # 다른 날의 중심 지역이거나 이미 함께 돈 지역이면 감점
    # 마지막 날 숙소 근처 쇼핑 (10-15, 여행 조건에 비행기 출발 시각이 있을 때만)
    last-day-radius-meters: 2000             # 숙소에서 이 거리 안 관광지만
    last-day-shopping-bonus: 0.3             # 쇼핑(백화점·쇼핑몰·시장) 가산

  cafe:                          # 오후 쉬는 시간 카페·디저트 (10-16). 점심~저녁 사이 한 곳, 시간이 모자라면 넣지 않음
    enabled: true
    stay-minutes: 40
    earliest-minutes: 840        # 14:00 (앞 장소를 떠나는 시각 기준)
    latest-minutes: 990          # 16:30
    preferred-minutes: 900       # 15:00에 가장 가까운 자리
    search-radii: [300, 600, 1000]
    max-yen: 2500                # 1인 예산 상한 (애프터눈 티처럼 비싼 곳 제외)
    distance-penalty: 0.5        # 점수 = 평점 − 거리(km) × 0.5

  weather:                       # 여행 날씨 (10-16). Open-Meteo, 키 없음, 비상업 무료, 화면에 출처 표시
    enabled: true
    forecast-url: https://api.open-meteo.com/v1/forecast
    archive-url: https://archive-api.open-meteo.com/v1/archive
    timeout-seconds: 5
    forecast-days: 15            # 오늘 + 15일까지 예보 (그 밖은 작년 같은 날)
    past-days: 92
    forecast-cache-minutes: 180
    archive-cache-hours: 168
    rain-probability-percent: 60 # 예보: 강수 확률 이 % 이상이면 비 오는 날
    rain-millimeters: 5.0        # 작년 날씨: 강수량 이 mm 이상이면 비 오는 날

  fare:                          # 교통비 추정 (10-16). 지하철 IC 운임(성인), 메트로 = 최소 / 도에이 = 최대. 운임이 바뀌면 여기만 고친다
    metro-bands:                 # 도쿄 메트로 (10-16 공식 운임표)
      - { max-km: 6, yen: 178 }
      - { max-km: 11, yen: 209 }
      - { max-km: 19, yen: 252 }
      - { max-km: 27, yen: 293 }
      - { max-km: 40, yen: 324 }
    toei-bands:                  # 도에이 지하철 (10-16 공식 운임표)
      - { max-km: 4, yen: 178 }
      - { max-km: 9, yen: 220 }
      - { max-km: 15, yen: 272 }
      - { max-km: 21, yen: 325 }
      - { max-km: 27, yen: 377 }
      - { max-km: 46, yen: 430 }
    pass24-yen: 1000             # Tokyo Subway Ticket 24·48·72시간권 (메트로·도에이 전 노선)
    pass48-yen: 1500
    pass72-yen: 2000
    cities:                      # 도쿄 밖 도시 (11-18, 교통비 조사 문서의 공식 확인 값). max-bands 가 없으면 min-bands 와 같다
      OSAKA:              # 오사카 메트로 (3·7·13·19km)
        min-bands:
          - { max-km: 3, yen: 190 }
          - { max-km: 7, yen: 240 }
          - { max-km: 13, yen: 290 }
          - { max-km: 19, yen: 340 }
          - { max-km: 99, yen: 390 }
        pass24-yen: 820
        pass-name: "엔조이 에코 카드 (토·휴일 620)"
      KYOTO:              # 최소 = 지하철 1구간 220 · 그 밖은 시버스 균일 230 / 최대 = 시영 지하철 (2025-10-01 개정)
        min-bands:
          - { max-km: 3, yen: 220 }
          - { max-km: 99, yen: 230 }
        max-bands:
          - { max-km: 3, yen: 220 }
          - { max-km: 7, yen: 260 }
          - { max-km: 11, yen: 290 }
          - { max-km: 15, yen: 330 }
          - { max-km: 99, yen: 360 }
        pass24-yen: 1100
        pass-name: "지하철·버스 1일권"
      KOBE:               # 고베 시영 지하철 (공식 PDF 경계)
        min-bands:
          - { max-km: 3, yen: 210 }
          - { max-km: 7, yen: 240 }
          - { max-km: 10, yen: 280 }
          - { max-km: 13, yen: 310 }
          - { max-km: 16, yen: 350 }
          - { max-km: 19, yen: 380 }
          - { max-km: 23, yen: 410 }
          - { max-km: 27, yen: 440 }
          - { max-km: 99, yen: 470 }
        pass24-yen: 980
        pass-name: "지하철 QR 1일 승차권"
      NARA:               # 나라교통 시내 버스 230 (노선별 상이)
        min-bands:
          - { max-km: 99, yen: 230 }
        pass24-yen: 600
        pass-name: "나라공원·니시노쿄 세계유산 1-Day Pass"
      YOKOHAMA:           # 최소 = 지하철 1구간 210 · 그 밖은 시영 버스 220 / 최대 = 시영 지하철 (이후 4km마다 +30)
        min-bands:
          - { max-km: 3, yen: 210 }
          - { max-km: 99, yen: 220 }
        max-bands:
          - { max-km: 3, yen: 210 }
          - { max-km: 7, yen: 250 }
          - { max-km: 11, yen: 280 }
          - { max-km: 15, yen: 310 }
          - { max-km: 19, yen: 340 }
          - { max-km: 23, yen: 370 }
          - { max-km: 27, yen: 400 }
          - { max-km: 31, yen: 430 }
          - { max-km: 99, yen: 460 }
        pass24-yen: 830
        pass-name: "버스·지하철 1일권"
      KAMAKURA:           # 에노덴 (가마쿠라→하세 200, →에노시마 260)
        min-bands:
          - { max-km: 3, yen: 200 }
          - { max-km: 99, yen: 260 }
        pass24-yen: 800
        pass-name: "에노덴 1일권 노리오리쿤"
      HAKONE:             # 하코네 프리패스로 다닌다 (오다와라발 2일 6,000 · 3일 6,400, 1일권 없음)
        pass48-yen: 6000
        pass72-yen: 6400
        day-yen-if-ride: 6000
        pass-name: "하코네 프리패스 (오다와라발)"
      KAWAGUCHIKO:        # 후지큐 주유버스 2일 프리 승차권으로 다닌다 (1일권 없음)
        pass48-yen: 2000
        day-yen-if-ride: 2000
        pass-name: "주유버스 2일 프리 승차권"
      NAGOYA:             # 나고야 시영 지하철 (3·7·11·15km)
        min-bands:
          - { max-km: 3, yen: 210 }
          - { max-km: 7, yen: 240 }
          - { max-km: 11, yen: 270 }
          - { max-km: 15, yen: 310 }
          - { max-km: 99, yen: 340 }
        pass24-yen: 760
        pass-name: "지하철 전선 24시간권"
      KANAZAWA:           # 호쿠테쓰 노선버스 220 (2026-02 인상)
        min-bands:
          - { max-km: 99, yen: 220 }
        pass24-yen: 800
        pass-name: "가나자와 시내 1일 프리 승차권"
      TAKAYAMA:           # 노라마이카·마치나미 버스 100 ~ 노히 버스 210
        min-bands:
          - { max-km: 99, yen: 100 }
        max-bands:
          - { max-km: 99, yen: 210 }
      HIROSHIMA:          # 히로덴 노면전차 240 균일 (2025-02-01 개정)
        min-bands:
          - { max-km: 99, yen: 240 }
        pass24-yen: 700
        pass-name: "전차 1일 승차권"
      FUKUOKA:            # 후쿠오카 시영 지하철
        min-bands:
          - { max-km: 3, yen: 210 }
          - { max-km: 7, yen: 260 }
          - { max-km: 11, yen: 300 }
          - { max-km: 15, yen: 340 }
          - { max-km: 19, yen: 360 }
          - { max-km: 99, yen: 380 }
        pass24-yen: 640
        pass-name: "지하철 1일 승차권"
      BEPPU:              # My벳푸 미니 프리로 다닌다 (1일 1,100 · 2일 1,700)
        pass24-yen: 1100
        pass48-yen: 1700
        day-yen-if-ride: 1100
        pass-name: "My벳푸 미니 프리"
      YUFUIN:             # My벳푸 와이드 프리 (벳푸·유후인, 1일 1,800 · 2일 2,800). 마을 안은 대부분 걷는다
        pass24-yen: 1800
        pass48-yen: 2800
        day-yen-if-ride: 1800
        pass-name: "My벳푸 와이드 프리"
      SAPPORO:            # 삿포로 시영 지하철 (2026-04-01 갱신)
        min-bands:
          - { max-km: 3, yen: 210 }
          - { max-km: 7, yen: 250 }
          - { max-km: 11, yen: 290 }
          - { max-km: 15, yen: 330 }
          - { max-km: 19, yen: 360 }
          - { max-km: 99, yen: 380 }
        pass24-yen: 830
        pass-name: "지하철 전용 1일 승차권 (토·일·공휴일 도니치카 520)"
      OTARU:              # 중앙버스 시내 균일 240
        min-bands:
          - { max-km: 99, yen: 240 }
        pass24-yen: 800
        pass-name: "오타루 시내 1일 승차권"
      NAHA:               # 유이레일 (공항 기준 겐초마에 290 · 마키시 320 · 슈리 360 으로 거리 근사)
        min-bands:
          - { max-km: 5, yen: 290 }
          - { max-km: 8, yen: 320 }
          - { max-km: 99, yen: 360 }
        pass24-yen: 1000
        pass48-yen: 1800
        pass-name: "유이레일 1일권·2일권"

  poster:                        # 여행 포스터 (10-12): 1장 지도 포스터 + 상세 일정표 (모두 이미지 AI)
    enabled: true
    model: gpt-image-2           # 사용자 지정 크기(page-size)를 받는 gpt-image-2 계열. 더 새 모델: gpt-image-2.5-flare
    quality: medium              # low / medium / high
    page-size: 1088x1536         # 모든 장 같은 크기, A4 세로 비율 (10-14, 16의 배수)
    cover-days-per-page: 2       # 지도 한 장에 넣을 날 수 (넘으면 지도 여러 장)
    days-per-detail-page: 2      # 상세 일정표 한 장에 넣을 날 수
    cover-items-per-day: 8       # 지도에서 하루에 보여줄 장소 수 (넘으면 식당 1곳만, 그다음 관광지를 줄임)
    daily-limit: 3               # 여행당 24시간 동안 포스터 묶음 수
    timeout-seconds: 240
    parallel: 2                  # 동시에 그리는 장 수
    stale-minutes: 20            # 이보다 오래 GENERATING이면 실패로 본다 (서버 재시작 등)
    storage-dir: storage/posters # 그림 파일 폴더 (.gitignore)

  exchange-rate:                 # 엔화 환율 (10-12). 오늘 받은 값 → 수출입은행 → Frankfurter → 마지막 저장값 → meal.krw-per-yen
    enabled: true
    koreaexim-api-key: ${KOREAEXIM_API_KEY:}   # .env (없으면 Frankfurter부터)
    timeout-seconds: 5
    lookback-days: 7             # 주말·공휴일·오전 11시 전은 값이 없어서 며칠 전까지 거슬러
    retry-after-minutes: 30      # 모두 실패하면 이 시간 동안 다시 묻지 않음
    min-krw-per-yen: 5.0         # 이 범위를 벗어나면 단위 오류로 보고 버림
    max-krw-per-yen: 15.0

  meal:
    krw-per-yen: 9.0             # 환율 API(exchange-rate)를 모두 실패하고 저장값도 없을 때 쓰는 고정값
    lunch-share: 0.35            # 하루 식비 중 점심 비율 (나머지는 저녁)
    min-lunch-yen: 1000          # 예산이 아주 적어도 이 정도는 잡음
    min-dinner-yen: 2000
    prior-reviews: 50            # 식당 보정 평점 기준 리뷰 수
    prefer-bonus: 0.1            # 좋아하는 장르 가산 (타베로그 평점은 3.0~4.5 범위라 작게)
    distance-penalty-per-km: 0.1 # 멀수록 감점
    search-radii: 500,1000,1500  # 이 순서로 넓혀가며 검색
    wanted-extra-radii: 2000,3000 # 채팅에서 원하는 음식을 말했는데 위 반경에 없으면 여기까지 더 넓혀서
    budget-relax-steps: 1.2,1.4  # 그래도 없으면 예산을 이만큼 올려서
    repeat-group-penalty: 0.15   # 같은 묶음(라멘류 등)이 이미 나왔으면 나온 횟수 × 이만큼 감점
    min-candidates: 3            # 반경 안에 후보가 이만큼 안 되면 더 넓게 (1곳뿐이면 선택지가 없음, 체인점은 세지 않음)
    chain-penalty: 0.3           # 체인점(평점 없음) 점수 = 주변 평균 − 이 값 (타베로그가 모자랄 때·싼 점심용)

  itinerary:
    daily-generation-limit: 5    # 여행당 24시간 동안 AI 일정 생성 횟수 (수정·되돌리기는 세지 않음)
