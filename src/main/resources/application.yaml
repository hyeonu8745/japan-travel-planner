spring:
  application:
    name: japan-travel-planner

  datasource:
    url: jdbc:postgresql://localhost:5432/japan_travel
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: "japan-travel-planner-jwt-secret-key-please-change-this-later-32bytes-minimum"
  expiration-ms: 3600000  # 1시간