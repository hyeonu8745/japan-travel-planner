spring:
  application:
    name: japan-travel-planner

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/japan_travel
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000  # 1시간

app:
  cors:
    allowed-origins: http://localhost:5173

  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com/v1
    basic-model: gpt-4o-mini
    advanced-model: gpt-5.6-terra
    advanced-reasoning-effort: low
    max-output-tokens: 2000
    timeout-seconds: 60

  google:
    api-key: ${GOOGLE_MAPS_API_KEY}
    timeout-seconds: 10

  travel:
    use-google-routes: false     # true면 도보 시간을 Google Routes(WALK)에서 실시간 조회 (저장 안 함)
    walk-threshold-minutes: 20   # 이 시간 이내는 도보
    relaxed-walk-threshold-minutes: 10   # 여유 속도·이동 제약이 있을 때
    walk-meters-per-minute: 80
    walk-detour: 1.25            # 실제 길은 직선보다 25% 돌아감
    transit-meters-per-minute: 333   # 대중교통 평균 (시속 20km, 환승 포함)
    transit-detour: 1.3
    transit-overhead-minutes: 8  # 역까지 걷기, 기다리기
    drive-meters-per-minute: 416 # 도심 운전 (시속 25km)
    drive-overhead-minutes: 5    # 주차

  candidate:
    prior-reviews: 200        # 보정 평점: 이만큼의 리뷰는 전체 평균이라고 가정
    interest-bonus: 0.3       # 관심사와 맞는 type이면 가산
    extra-candidates: 2       # 하루 방문 수보다 더 뽑아두는 예비 후보
    same-spot-meters: 150     # 이 거리 안의 관광지는 같은 장소로 보고 점수 높은 하나만 남김
    min-reviews: 100          # 리뷰가 이보다 적은 관광지는 일정 후보에서 제외

  meal:
    krw-per-yen: 9.0             # 환율 고정값 (100엔 = 900원). #6에서 API로 교체 예정
    lunch-share: 0.35            # 하루 식비 중 점심 비율 (나머지는 저녁)
    min-lunch-yen: 1000          # 예산이 아주 적어도 이 정도는 잡음
    min-dinner-yen: 2000
    prior-reviews: 50            # 식당 보정 평점 기준 리뷰 수
    prefer-bonus: 0.1            # 좋아하는 장르 가산 (타베로그 평점은 3.0~4.5 범위라 작게)
    distance-penalty-per-km: 0.1 # 멀수록 감점
    search-radii: 500,1000,1500  # 이 순서로 넓혀가며 검색
    budget-relax-steps: 1.2,1.4  # 그래도 없으면 예산을 이만큼 올려서
    repeat-group-penalty: 0.15   # 같은 묶음(라멘류 등)이 이미 나왔으면 나온 횟수 × 이만큼 감점
    min-candidates: 3            # 반경 안에 후보가 이만큼 안 되면 더 넓게 (1곳뿐이면 선택지가 없음)

  itinerary:
    daily-generation-limit: 5    # 여행당 24시간 동안 AI 일정 생성 횟수 (수정·되돌리기는 세지 않음)
