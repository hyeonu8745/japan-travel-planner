spring:
  application:
    name: japan-travel-planner

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/japan_travel
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000  # 1시간

app:
  cors:
    allowed-origins: http://localhost:5173

  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com/v1
    basic-model: gpt-4o-mini
    advanced-model: gpt-5.6-terra
    advanced-reasoning-effort: low
    max-output-tokens: 2000
    timeout-seconds: 60

  google:
    api-key: ${GOOGLE_MAPS_API_KEY}
    timeout-seconds: 10
    places-language: ko          # 장소 상세(소개·리뷰·영업시간) 언어. 리뷰는 번역되어 오고 원문도 함께 온다
    photo-max-width-px: 800      # 장소 사진 기본 가로 크기

  restaurant-match:              # 타베로그 식당 ↔ Google 장소 매칭 (일정 생성 때 고른 식당만, Text Search Pro 월 5,000건 무료)
    enabled: true
    search-radius-meters: 300    # 이 원 안을 우선해서 검색
    max-distance-meters: 300     # 우리 좌표와 이 거리 안이어야 같은 가게
    min-name-similarity: 0.7     # 이름 비슷한 정도 (0~1)
    loanword-max-distance-meters: 100   # 가타카나 ↔ 영어 이름으로 맞출 때 허용 거리
    loanword-min-similarity: 0.6        # 가타카나 ↔ 영어 자음 뼈대 비슷한 정도
    page-size: 3                 # 검색 결과 몇 개를 비교할지
    verify-rounds: 2             # 폐업 의심 식당을 빼고 다시 계산하는 최대 횟수

  korean-name:                   # 장소·식당 한국어 이름 (일정에 처음 쓰일 때 AI로 한 번 만들어 저장, 10-11)
    enabled: true
    timeout-seconds: 40          # 넘으면 원래 이름으로 진행 (고급 모델은 이름 30개에 수십 초)
    max-per-call: 30             # 한 번에 보내는 이름 수
    retry-after-minutes: 30      # 실패한 이름은 이 시간 동안 다시 묻지 않는다
    use-advanced-model: true     # gpt-5.6-terra로 만든다 (10-11: 기본 모델이 増上寺 → "조우장사", Chopsticks → "초밥"). 이름마다 한 번만 만들어 저장

  review-insight:                # 식당 상세의 Google 리뷰를 AI(gpt-4o-mini)로 읽고 차별·불친절·위생·좋은 점 표시 (저장 안 함)
    enabled: true
    timeout-seconds: 8           # 넘으면 분석 없이 상세를 돌려준다

  travel:
    use-google-routes: false     # true면 도보 시간을 Google Routes(WALK)에서 실시간 조회 (저장 안 함)
    walk-threshold-minutes: 30   # 이 시간 이내는 도보 (10-10: 20 → 30, 한 지역 안에서 넓게 걷는다)
    relaxed-walk-threshold-minutes: 10   # 여유 속도·이동 제약·가까운 곳 선호일 때
    walk-meters-per-minute: 80
    walk-detour: 1.25            # 실제 길은 직선보다 25% 돌아감
    transit-meters-per-minute: 333   # 대중교통 평균 (시속 20km, 환승 포함)
    transit-detour: 1.3
    transit-overhead-minutes: 8  # 역까지 걷기, 기다리기
    drive-meters-per-minute: 416 # 도심 운전 (시속 25km)
    drive-overhead-minutes: 5    # 주차

  candidate:
    prior-reviews: 200        # 보정 평점: 이만큼의 리뷰는 전체 평균이라고 가정
    interest-bonus: 0.3       # 관심사와 맞는 type이면 가산
    extra-candidates: 2       # 하루 방문 수보다 더 뽑아두는 예비 후보
    same-spot-meters: 150     # 이 거리 안의 관광지는 같은 장소로 보고 점수 높은 하나만 남김
    min-reviews: 100          # 리뷰가 이보다 적은 관광지는 일정 후보에서 제외
    same-kind-penalty: 0.15   # 하루 안에서 같은 종류(정원·절·박물관 등)를 또 고르면 감점 (가까운 곳 위주 여행은 적용 안 함)
    near-meters: 500          # 이미 고른 곳에서 이 거리 안이면
    near-penalty: 0.2         # 이만큼 감점 (한 동네에 몰리지 않게)
    # 하루 이동 범위 (10-11 사용자 결정: 하루에 두 지역은 돈다). 중심 지역에서 이 거리 안의 이웃 지역 하나를 함께 돈다
    day-range-compact-km: 7   # 가까운 곳 위주 (이동 제약·적게 걷기)
    day-range-transit-km: 10  # 대중교통
    day-range-car-km: 12      # 렌터카
    partner-distance-penalty-per-km: 0.15   # 이웃 지역 고를 때 중심 사이 1km당 감점
    partner-reuse-penalty: 0.5               # 다른 날의 중심 지역이거나 이미 함께 돈 지역이면 감점
    # 마지막 날 숙소 근처 쇼핑 (10-15, 여행 조건에 비행기 출발 시각이 있을 때만)
    last-day-radius-meters: 2000             # 숙소에서 이 거리 안 관광지만
    last-day-shopping-bonus: 0.3             # 쇼핑(백화점·쇼핑몰·시장) 가산

  fare:                          # 교통비 추정 (10-16). 지하철 IC 운임(성인), 메트로 = 최소 / 도에이 = 최대. 운임이 바뀌면 여기만 고친다
    metro-bands:                 # 도쿄 메트로 (10-16 공식 운임표)
      - { max-km: 6, yen: 178 }
      - { max-km: 11, yen: 209 }
      - { max-km: 19, yen: 252 }
      - { max-km: 27, yen: 293 }
      - { max-km: 40, yen: 324 }
    toei-bands:                  # 도에이 지하철 (10-16 공식 운임표)
      - { max-km: 4, yen: 178 }
      - { max-km: 9, yen: 220 }
      - { max-km: 15, yen: 272 }
      - { max-km: 21, yen: 325 }
      - { max-km: 27, yen: 377 }
      - { max-km: 46, yen: 430 }
    pass24-yen: 1000             # Tokyo Subway Ticket 24·48·72시간권 (메트로·도에이 전 노선)
    pass48-yen: 1500
    pass72-yen: 2000

  poster:                        # 여행 포스터 (10-12): 1장 지도 포스터 + 상세 일정표 (모두 이미지 AI)
    enabled: true
    model: gpt-image-2           # 사용자 지정 크기(page-size)를 받는 gpt-image-2 계열. 더 새 모델: gpt-image-2.5-flare
    quality: medium              # low / medium / high
    page-size: 1088x1536         # 모든 장 같은 크기, A4 세로 비율 (10-14, 16의 배수)
    cover-days-per-page: 2       # 지도 한 장에 넣을 날 수 (넘으면 지도 여러 장)
    days-per-detail-page: 2      # 상세 일정표 한 장에 넣을 날 수
    cover-items-per-day: 8       # 지도에서 하루에 보여줄 장소 수 (넘으면 식당 1곳만, 그다음 관광지를 줄임)
    daily-limit: 3               # 여행당 24시간 동안 포스터 묶음 수
    timeout-seconds: 240
    parallel: 2                  # 동시에 그리는 장 수
    stale-minutes: 20            # 이보다 오래 GENERATING이면 실패로 본다 (서버 재시작 등)
    storage-dir: storage/posters # 그림 파일 폴더 (.gitignore)

  exchange-rate:                 # 엔화 환율 (10-12). 오늘 받은 값 → 수출입은행 → Frankfurter → 마지막 저장값 → meal.krw-per-yen
    enabled: true
    koreaexim-api-key: ${KOREAEXIM_API_KEY:}   # .env (없으면 Frankfurter부터)
    timeout-seconds: 5
    lookback-days: 7             # 주말·공휴일·오전 11시 전은 값이 없어서 며칠 전까지 거슬러
    retry-after-minutes: 30      # 모두 실패하면 이 시간 동안 다시 묻지 않음
    min-krw-per-yen: 5.0         # 이 범위를 벗어나면 단위 오류로 보고 버림
    max-krw-per-yen: 15.0

  meal:
    krw-per-yen: 9.0             # 환율 API(exchange-rate)를 모두 실패하고 저장값도 없을 때 쓰는 고정값
    lunch-share: 0.35            # 하루 식비 중 점심 비율 (나머지는 저녁)
    min-lunch-yen: 1000          # 예산이 아주 적어도 이 정도는 잡음
    min-dinner-yen: 2000
    prior-reviews: 50            # 식당 보정 평점 기준 리뷰 수
    prefer-bonus: 0.1            # 좋아하는 장르 가산 (타베로그 평점은 3.0~4.5 범위라 작게)
    distance-penalty-per-km: 0.1 # 멀수록 감점
    search-radii: 500,1000,1500  # 이 순서로 넓혀가며 검색
    wanted-extra-radii: 2000,3000 # 채팅에서 원하는 음식을 말했는데 위 반경에 없으면 여기까지 더 넓혀서
    budget-relax-steps: 1.2,1.4  # 그래도 없으면 예산을 이만큼 올려서
    repeat-group-penalty: 0.15   # 같은 묶음(라멘류 등)이 이미 나왔으면 나온 횟수 × 이만큼 감점
    min-candidates: 3            # 반경 안에 후보가 이만큼 안 되면 더 넓게 (1곳뿐이면 선택지가 없음)

  itinerary:
    daily-generation-limit: 5    # 여행당 24시간 동안 AI 일정 생성 횟수 (수정·되돌리기는 세지 않음)
